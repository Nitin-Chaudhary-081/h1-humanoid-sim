<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Animated Unitree H1-style humanoid robot walking in place">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fb"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1d24"/>
      <stop offset="1" stop-color="#2b303b"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#262a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4dd0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4dd0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="800" height="400" fill="url(#bg)"/>
  <circle cx="400" cy="330" r="60" fill="url(#glow)" opacity="0.5"/>

  <g id="robot">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>

    <!-- FAR ARM (behind torso) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="28 365 185; -28 365 185; 28 365 185" dur="1.2s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <g transform="translate(365 185)">
        <rect x="-7" y="-4" width="14" height="62" rx="7" fill="url(#far)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 58; 22 0 58; 0 0 58" dur="1.2s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
          <rect x="-7" y="58" width="14" height="52" rx="7" fill="url(#far)"/>
          <circle cx="0" cy="58" r="7" fill="#4a4f5c"/>
          <rect x="-8" y="104" width="16" height="12" rx="4" fill="#555b68"/>
        </g>
      </g>
    </g>

    <!-- FAR LEG -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-22 405 272; 22 405 272; -22 405 272" dur="1.2s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <g transform="translate(405 272)">
        <rect x="-9" y="-6" width="18" height="58" rx="8" fill="url(#far)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 52; 34 0 52; 0 0 52" dur="1.2s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
          <rect x="-9" y="52" width="18" height="54" rx="8" fill="url(#far)"/>
          <circle cx="0" cy="52" r="8" fill="#4a4f5c"/>
          <rect x="-11" y="102" width="22" height="12" rx="5" fill="#555b68"/>
        </g>
      </g>
    </g>

    <!-- TORSO -->
    <rect x="335" y="130" width="130" height="145" rx="18" fill="url(#body)" stroke="#0d0f14" stroke-width="2"/>
    <rect x="355" y="150" width="90" height="8" rx="4" fill="#3d4452"/>
    <rect x="355" y="168" width="90" height="8" rx="4" fill="#3d4452"/>
    <circle cx="386" cy="228" r="12" fill="#4dd0ff" opacity="0.85">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="414" cy="228" r="12" fill="#4dd0ff" opacity="0.85">
      <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" begin="-1s" repeatCount="indefinite"/>
    </circle>

    <!-- HEAD -->
    <g transform="translate(400 92)">
      <rect x="-42" y="-38" width="84" height="68" rx="20" fill="url(#body)" stroke="#0d0f14" stroke-width="2"/>
      <rect x="-28" y="-20" width="56" height="10" rx="5" fill="#4dd0ff">
        <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <circle cx="-26" cy="14" r="7" fill="#555b68"/>
      <circle cx="0" cy="14" r="7" fill="#555b68"/>
      <circle cx="26" cy="14" r="7" fill="#555b68"/>
    </g>

    <!-- NEAR ARM -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-28 435 185; 28 435 185; -28 435 185" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <g transform="translate(435 185)">
        <rect x="-7" y="-4" width="14" height="62" rx="7" fill="url(#body)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 58; -24 0 58; 0 0 58" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
          <rect x="-7" y="58" width="14" height="52" rx="7" fill="url(#body)"/>
          <circle cx="0" cy="58" r="7" fill="#4a4f5c"/>
          <rect x="-8" y="104" width="16" height="12" rx="4" fill="#555b68"/>
        </g>
      </g>
    </g>

    <!-- NEAR LEG -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="22 395 272; -22 395 272; 22 395 272" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
      <g transform="translate(395 272)">
        <rect x="-9" y="-6" width="18" height="58" rx="8" fill="url(#body)"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 0 52; -34 0 52; 0 0 52" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1"/>
          <rect x="-9" y="52" width="18" height="54" rx="8" fill="url(#body)"/>
          <circle cx="0" cy="52" r="8" fill="#4a4f5c"/>
          <rect x="-11" y="102" width="22" height="12" rx="5" fill="#555b68"/>
        </g>
      </g>
    </g>
  </g>

  <!-- GROUND -->
  <rect x="0" y="338" width="800" height="3" rx="1.5" fill="#b6c0d0"/>
</svg>