# Anomaly thresholds (per-sample), tuned with real data after first recordings.
# Naming convention (see thresholds.py ThresholdEvaluator):
#   *_min  -> LOWER bound: breached when sample value < limit
#   *_max  -> UPPER bound: breached when sample value > limit
# A breach of *_max is an UPPER-bound breach; *_min a LOWER-bound breach.
joint_states_hz_min: 30.0
odometry_hz_min: 2.0
imu_hz_min: 30.0
body_pitch_deg_max: 45.0
body_roll_deg_max: 45.0
cpu_load_max: 0.95
ram_used_mb_max: 1700.0
fall_risk_score_max: 0.8