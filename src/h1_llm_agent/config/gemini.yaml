# Gemini agent settings. API key NEVER stored here — read env GEMINI_API_KEY.
h1_llm_agent:
  ros__parameters:
    model: gemini-3.6-flash
    thinking_level: low
    max_tool_steps: 15
    step_timeout_s: 20.0
    max_same_rejection: 2
    rate_limit_per_min: 10
    walk_distance_min: 0.05
    walk_distance_max: 1.0
    allowed_tools: ['stand', 'walk', 'stop', 'stop_robot', 'pick_object']
    estop_topic: /estop
    input_topic: /h1/llm/input_text
    intent_topic: /h1/llm/intent
    tool_calls_topic: /h1/llm/tool_calls
    events_topic: /h1/llm/events
    audit_log: /home/ubuntu/humanoid_sim_ws/data/llm_audit.jsonl
    executor_type: ros
    action_timeout_sec: 120.0
    use_sim_time: true
