# h1_telemetry parameters for the REAL H1-2 robot.
#
# sync_enabled: true -> the AWS sync thread uploads telemetry.jsonl to S3
# (bucket h1-sim-telemetry) and raises alerts via SNS on critical thresholds.
# use_sim_time: false -> sampling and the sync interval use wall-clock seconds.

h1_telemetry_node:
  ros__parameters:
    use_sim_time: false
    thresholds_yaml: ""            # empty = h1_telemetry package default (config/thresholds.yaml)
    data_dir: /home/ubuntu/humanoid_sim_ws/data
    sample_period: 1.0             # seconds
    sync_enabled: true
    sync_interval_sim_sec: 60      # wall-clock seconds between S3 syncs