# Gemini agent parameters for the REAL H1-2 robot.
#
# executor_type: ros -> tools are executed as real ROS 2 action goals on
# /h1/command (no mocks). The API key is NEVER stored in this file: the node
# reads GEMINI_API_KEY from the environment (provided by
# deploy/systemd/h1-robot.service via EnvironmentFile=/etc/h1-robot.env).

h1_llm_agent:
  ros__parameters:
    model: gemini-3.6-flash
    thinking_level: low
    max_tool_steps: 15
    step_timeout_s: 20.0
    max_same_rejection: 2
    rate_limit_per_min: 10
    walk_distance_min: 0.05
    walk_distance_max: 0.5          # shorter walks on hardware (balance/safety)
    allowed_tools: ['stand', 'walk', 'stop', 'stop_robot']
    estop_topic: /estop
    input_topic: /h1/llm/input_text
    intent_topic: /h1/llm/intent
    tool_calls_topic: /h1/llm/tool_calls
    events_topic: /h1/llm/events
    audit_log: /home/ubuntu/humanoid_sim_ws/data/llm_audit.jsonl
    executor_type: ros
    action_timeout_sec: 120.0
    use_sim_time: false