# h1_aws_sync configuration (Wave 2: telemetry <-> AWS sync).
# All AWS resource names/params live here - never hardcode in code.
# Always-Free plan only: S3 (credit draw ~$0.12/mo, lifecycle expire 30d),
# DynamoDB PROVISIONED (25/25), SNS/SQS free. No API Gateway / IoT Core.

bucket: h1-sim-telemetry
prefix: telemetry
region: ap-south-1

data_dir: /home/ubuntu/humanoid_sim_ws/data
telemetry_file: telemetry.jsonl
watermark_file: aws_sync_watermark
sns_state_file: aws_sync_sns_state

table: h1_alerts

topic_arn: arn:aws:sns:ap-south-1:250738719996:h1-alerts

alert_throttle:
  max_messages: 1
  window_minutes: 10

s3:
  content_type: application/x-ndjson